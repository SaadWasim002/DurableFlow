spring:
  application:
    name: durableflow
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:durableflow}
    username: ${DB_USERNAME:durableflow}
    password: ${DB_PASSWORD:durableflow_dev}
    hikari:
      maximum-pool-size: 5
  sql:
    init:
      mode: never
  flyway:
    validate-on-migrate: true
    clean-disabled: true
  task:
    scheduling:
      pool:
        size: 1
      shutdown:
        await-termination: true
        await-termination-period: 20s

durableflow:
  execution:
    enabled: ${EXECUTION_ENABLED:true}
    poll-delay-ms: ${EXECUTION_POLL_DELAY_MS:250}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg %kvp%n"

server:
  address: 127.0.0.1
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
